<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 기획 평가서 — 세모 게임실</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@page { size: A4 portrait; margin: 13mm 13mm; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #5d626b; color: #15171b;
  font-family: "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", system-ui, sans-serif;
  font-size: 10pt; line-height: 1.55; word-break: keep-all;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
h4, h5, h6, p { margin: 0; }
.bar { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; background: #0C0E12; color: #F2EDE3; font-size: 13px; }
.bar a, .bar button { font: inherit; font-weight: 650; padding: 8px 15px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); background: transparent; color: #F2EDE3; cursor: pointer; text-decoration: none; margin-left: 6px; }
.bar button.p { background: #F2EDE3; color: #0C0E12; border-color: transparent; }
.bar b { font-weight: 800; }

.sheet { width: 210mm; min-height: 297mm; margin: 18px auto; padding: 14mm 14mm; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.doc-head { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 8px; border-bottom: 2.5px solid #15171b; margin-bottom: 10px; }
.doc-head h1 { margin: 0; font-size: 15pt; font-weight: 850; letter-spacing: -.02em; }
.doc-head span { font-size: 8.5pt; color: #5b616b; }

.rv-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.rv-kicker { font-size: 8.5pt; font-weight: 800; color: #6b717b; letter-spacing: .04em; }
.rv-head h4 { margin-top: 2px; font-size: 18pt; font-weight: 900; letter-spacing: -.03em; }
.rv-count { display: flex; gap: 5px; }
.rv-count span { font-size: 9pt; font-weight: 800; padding: 3px 9px; border-radius: 999px; border: 1px solid #c9ced5; }
.rv-sum { margin-top: 8px; padding: 9px 12px; border-left: 3px solid #15171b; background: #f5f6f8; font-size: 10pt; line-height: 1.65; }
.rv-h { margin: 12px 0 6px; font-size: 9pt; font-weight: 800; color: #3d434c; letter-spacing: .02em; }
.rv-h small { font-weight: 600; color: #7a808a; margin-left: 6px; }
.rv-marks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.rv-mark { display: flex; gap: 8px; padding: 7px 9px; border: 1px solid #d6dae0; border-radius: 8px; page-break-inside: avoid; }
.rv-mark .sym { flex: none; width: 20px; font-size: 13pt; font-weight: 900; line-height: 1.2; text-align: center; }
.rv-mark b { font-size: 9.5pt; }
.rv-mark p { margin-top: 2px; font-size: 8.6pt; line-height: 1.55; color: #3d434c; }
.good .sym { color: #0a8a6c; } .warn .sym { color: #b07800; } .bad .sym { color: #d0391a; }
.rv-count .good { color: #0a8a6c; } .rv-count .warn { color: #b07800; } .rv-count .bad { color: #d0391a; }
.rv-bug { margin-top: 6px; padding: 8px 11px; border: 1.5px solid #15171b; border-radius: 8px; page-break-inside: avoid; }
.rv-lv { font-size: 8pt; font-weight: 800; color: #d0391a; }
.rv-bug + .rv-bug .rv-lv { color: #b07800; }
.rv-bug h6 { margin: 1px 0 5px; font-size: 11pt; font-weight: 850; }
.rv-bug dl { margin: 0; display: grid; grid-template-columns: 22mm 1fr; gap: 3px 10px; font-size: 8.8pt; line-height: 1.55; }
.rv-bug dt { font-weight: 800; color: #6b717b; }
.rv-bug dd { margin: 0; }
.rv-bug ol { margin: 0; padding-left: 15px; }
.rv-table { width: 100%; border-collapse: collapse; font-size: 8.6pt; page-break-inside: avoid; }
.rv-table th, .rv-table td { border: 1px solid #d0d5db; padding: 4px 7px; text-align: left; vertical-align: top; }
.rv-table th { background: #eef0f3; font-size: 8pt; }
.rv-table td.v { font-weight: 800; white-space: nowrap; }
.page2 { page-break-before: always; }

@media print {
  body { background: #fff; }
  .bar { display: none; }
  .sheet { margin: 0; padding: 0; width: auto; min-height: 0; box-shadow: none; page-break-after: always; }
  .sheet:last-child { page-break-after: auto; }
}
</style>
</head>
<body>
<div class="bar">
  <span><b>AI 기획 평가서</b> · 게임 3개</span>
  <span>
    <a href="index.html">게임으로</a>
    <a href="worksheet.html">활동지</a>
    <button class="p" type="button" onclick="window.print()">인쇄 / PDF</button>
  </span>
</div>
<div id="pages"></div>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/review.js"></script>
<script>
  document.getElementById('pages').innerHTML = Object.keys(GAMES).map(n => `
    <section class="sheet" id="g${n}">
      <div class="doc-head"><h1>AI 기획 평가서</h1><span>세모 게임실 · 4학년 수학 「삼각형」</span></div>
      ${reviewHTML(n).replace('<h5 class="rv-h">고쳐 볼 곳</h5>', '<h5 class="rv-h page2">고쳐 볼 곳</h5>')}
    </section>`).join('');
  if (location.hash) { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
</script>
</body>
</html>
